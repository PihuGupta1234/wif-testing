name: Test GCP Workload Identity Federation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual run button in Actions tab

permissions:
  id-token: write # Required for GitHub to issue the OIDC JWT
  contents: read

jobs:
  test-wif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/732151768854/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'wif-testing@pihu-wif-testing.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication and API Access
        run: |
          echo "=========================================="
          echo "1. Current Active GCP Authenticated User:"
          gcloud auth list
          echo "=========================================="
          
          echo "2. Printing Short-Lived Access Token (First 25 chars):"
          gcloud auth print-access-token | cut -c 1-25
          echo "=========================================="

          echo "3. Testing GCP API Call (List Project Services):"
          gcloud services list --enabled --project=pihu-wif-testing --limit=5
